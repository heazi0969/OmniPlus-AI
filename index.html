<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniPulse AI — AI Content Repurposing & Multi-Channel Growth Engine</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              500: '#6366f1',
              600: '#4f46e5',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Left Sidebar -->
  <aside id="app-sidebar" class="fixed inset-y-0 left-0 z-40 w-64 glass-panel border-r border-white/5 transition-transform duration-300 -translate-x-full lg:translate-x-0 flex flex-col justify-between">
    <div class="p-5 space-y-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="App.navigate('dashboard')">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
            <i data-lucide="sparkles" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="font-extrabold text-base tracking-tight text-white flex items-center gap-1">
              OmniPulse <span class="text-xs px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 font-semibold">AI</span>
            </h1>
            <p class="text-[10px] text-slate-400 tracking-wider uppercase font-medium">Growth Engine</p>
          </div>
        </div>

        <button id="mobile-menu-close" class="lg:hidden text-slate-400 hover:text-white" onclick="document.getElementById('app-sidebar').classList.add('-translate-x-full')">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <nav class="space-y-1.5 pt-2">
        <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-3 mb-2">Main Menu</div>
        
        <a href="#" onclick="App.navigate('dashboard')" data-view="dashboard" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-semibold text-xs transition-all bg-indigo-600/15 text-indigo-400 border border-indigo-500/30">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span>Dashboard</span>
        </a>

        <a href="#" onclick="App.navigate('studio')" data-view="studio" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-xs transition-all text-slate-400 hover:text-white hover:bg-slate-800/60">
          <i data-lucide="zap" class="w-4 h-4 text-purple-400"></i>
          <span>Repurpose Studio</span>
        </a>

        <a href="#" onclick="App.navigate('library')" data-view="library" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-xs transition-all text-slate-400 hover:text-white hover:bg-slate-800/60">
          <i data-lucide="folder-kanban" class="w-4 h-4"></i>
          <span>Content Library</span>
        </a>

        <a href="#" onclick="App.navigate('calendar')" data-view="calendar" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-xs transition-all text-slate-400 hover:text-white hover:bg-slate-800/60">
          <i data-lucide="calendar" class="w-4 h-4"></i>
          <span>Content Calendar</span>
        </a>

        <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-3 pt-4 mb-2">Intelligence</div>

        <a href="#" onclick="App.navigate('brand-voice')" data-view="brand-voice" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-xs transition-all text-slate-400 hover:text-white hover:bg-slate-800/60">
          <i data-lucide="mic" class="w-4 h-4 text-indigo-400"></i>
          <span>Brand Voices</span>
        </a>

        <a href="#" onclick="App.navigate('analytics')" data-view="analytics" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-xs transition-all text-slate-400 hover:text-white hover:bg-slate-800/60">
          <i data-lucide="line-chart" class="w-4 h-4"></i>
          <span>Growth Analytics</span>
        </a>

        <a href="#" onclick="App.navigate('billing')" data-view="billing" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-xs transition-all text-slate-400 hover:text-white hover:bg-slate-800/60">
          <i data-lucide="credit-card" class="w-4 h-4 text-emerald-400"></i>
          <span>Billing & Plans</span>
        </a>
      </nav>
    </div>

    <div class="p-4 border-t border-white/5 bg-slate-950/40">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-500 to-indigo-500 flex items-center justify-center font-bold text-white text-xs">
          AH
        </div>
        <div class="flex-1 min-w-0">
          <h4 class="text-xs font-bold text-white truncate">Alex Harrison</h4>
          <span class="text-[10px] text-indigo-300 bg-indigo-500/20 px-1.5 py-0.5 rounded font-semibold">Creator Pro</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="flex-1 lg:pl-64 flex flex-col min-h-screen">
    
    <!-- Top Header -->
    <header class="sticky top-0 z-30 h-16 glass-nav px-4 sm:px-8 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button id="mobile-menu-toggle" class="lg:hidden p-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-300">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <button onclick="App.openSearchModal()" class="hidden sm:flex items-center gap-3 px-3.5 py-2 rounded-xl bg-slate-900/90 border border-slate-800 text-slate-400 hover:text-white text-xs transition-colors w-64">
          <i data-lucide="search" class="w-3.5 h-3.5 text-slate-500"></i>
          <span>Search or type command...</span>
          <kbd class="ml-auto text-[10px] font-mono px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-400">⌘K</kbd>
        </button>
      </div>

      <div class="flex items-center gap-3 sm:gap-4">
        <div onclick="App.navigate('billing')" class="cursor-pointer hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-slate-300 hover:border-indigo-500/50 transition-colors">
          <i data-lucide="zap" class="w-3.5 h-3.5 text-indigo-400"></i>
          <span id="header-credit-badge" class="font-semibold text-indigo-300">36 / 120 Credits Left</span>
        </div>

        <button onclick="App.navigate('studio')" class="px-3.5 py-2 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold text-xs flex items-center gap-1.5 shadow-md shadow-indigo-500/20 transition-all">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>New Repurpose</span>
        </button>
      </div>
    </header>

    <!-- Dynamic SPA Container -->
    <main id="app-main-content" class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto"></main>
  </div>

  <!-- Application Scripts -->
  <script src="js/config.js"></script>
  <script src="js/data/mockData.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/services/aiService.js"></script>
  <script src="js/views/dashboardView.js"></script>
  <script src="js/views/studioView.js"></script>
  <script src="js/views/libraryView.js"></script>
  <script src="js/views/calendarView.js"></script>
  <script src="js/views/brandVoiceView.js"></script>
  <script src="js/views/analyticsView.js"></script>
  <script src="js/views/billingView.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
